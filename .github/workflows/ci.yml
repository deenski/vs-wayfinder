name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  guard-and-unit-tests:
    name: guard-and-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Unit tests
        run: |
          unset VINTAGE_STORY
          dotnet test

  resolve-servers:
    name: resolve-servers
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Resolve stable and unstable servers
        id: matrix
        run: |
          set -euo pipefail
          python3 ci/resolve-server-matrix.py > "$RUNNER_TEMP/server-matrix.json"
          python3 - "$RUNNER_TEMP/server-matrix.json" <<'PY'
          import json
          import sys
          rows = json.load(open(sys.argv[1], encoding="utf-8"))["include"]
          unstable = [row for row in rows if row["channel"] == "unstable"]
          if not unstable:
              print("::notice title=Unstable server skipped::unstable.json has no linux server entry. Skipping that matrix leg.")
          for row in unstable:
              if row.get("skip"):
                  print(
                      "::notice title=Unstable server skipped::"
                      f"Unstable {row['version']} is not newer than stable {row['stable_version']}. "
                      "Skipping the unstable build-and-load job."
                  )
          PY
          {
            echo "matrix<<EOF"
            cat "$RUNNER_TEMP/server-matrix.json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-and-load:
    name: ${{ matrix.check_name }}
    needs: resolve-servers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.continue_on_error }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-servers.outputs.matrix) }}
    steps:
      - name: Skip unstable server that is not newer than stable
        if: matrix.skip
        env:
          UNSTABLE_VERSION: ${{ matrix.version }}
          STABLE_VERSION: ${{ matrix.stable_version }}
        run: |
          echo "::notice title=Unstable server skipped::Unstable ${UNSTABLE_VERSION} is not newer than stable ${STABLE_VERSION}. Skipping build and server load."
          echo "Unstable ${UNSTABLE_VERSION} is not newer than stable ${STABLE_VERSION}. Skipping build and server load."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ !matrix.skip }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        if: ${{ !matrix.skip }}
        with:
          global-json-file: global.json
      # Fork pull requests cannot read the private package. They use the cache
      # or the checksum-verified download. A failed pull on a same-repo run
      # falls back the same way.
      - name: Acquire Vintage Story server
        if: ${{ !matrix.skip }}
        uses: ./.github/actions/acquire-vs-server
        with:
          version: ${{ matrix.version }}
          md5: ${{ matrix.md5 }}
          url: ${{ matrix.url }}
          dest: ${{ runner.temp }}/vs-server
          use-ghcr: ${{ matrix.use_ghcr && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
          token: ${{ secrets.GITHUB_TOKEN }}
          actor: ${{ github.actor }}
      - name: Release build
        if: ${{ !matrix.skip }}
        env:
          VINTAGE_STORY: ${{ runner.temp }}/vs-server
        run: dotnet build -c Release
      - name: Assert mod zip
        if: ${{ !matrix.skip }}
        run: python3 ci/assert-mod-zip.py
      - name: Load mod on the headless server
        if: ${{ !matrix.skip }}
        env:
          VINTAGE_STORY: ${{ runner.temp }}/vs-server
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(Releases/wayfinding_*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "expected one mod zip, found ${#zips[@]}" >&2
            exit 1
          fi
          bash ci/smoke-server.sh "$VINTAGE_STORY" "${zips[0]}"
